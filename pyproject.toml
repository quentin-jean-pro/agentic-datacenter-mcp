[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-datacenter-mcp"
version = "1.0.0"
description = "Production-grade Model Context Protocol (FastMCP) and LangGraph agentic architecture for Green AI Data Center and GPU Workload Orchestration."
readme = "README.md"
authors = [
    { name = "Quentin JEAN", email = "quent.jr@free.fr" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.4.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "pydantic>=2.7.0",
    "duckdb>=1.0.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "BLE001", "TRY401", "SIM117", "RUF059"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
